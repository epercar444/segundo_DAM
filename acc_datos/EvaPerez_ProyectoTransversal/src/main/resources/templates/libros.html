<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
	<head>
		 <meta charset="UTF-8">
		 <title>Libros</title>
	</head>
	<body>
		<table>
		       <thead>
		           <tr>
		               <th>Titulo</th>
		               <th>Páginas Totales</th>
		           </tr>
		       </thead>
		       <tbody>
		           <tr th:each="libro : ${libros}">
		               <td th:text="${libro.titulo}">Titulo Libro</td>
		               <td th:text="${libro.pagTotales}">Páginas Totales</td>
		           </tr>
		       </tbody>
		   </table>
	</body>
</html>
