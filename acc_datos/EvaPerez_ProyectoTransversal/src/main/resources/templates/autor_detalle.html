<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Autor</title>
</head>
<body>
    <h1>Detalle del Autor</h1>
    <h2 th:text="${autor.nombre}">Nombre del Autor</h2>
    <p th:text="${autor.pais_origen}">País de origen</p>
    
    <h3>Libros escritos:</h3>
    <ul>
        <li th:each="libro : ${autor.librosEscritos}" th:text="${libro.titulo}"></li>
    </ul>
</body>
</html>
