<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #e8e0d0;
    font-family: 'DM Sans', sans-serif;
  }

  .top-bar {
    background: #e8e0d0;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 3px solid #c8463a;
  }

  .brand {
    font-family: 'Playfair Display', serif;
    color: #0f0e0b;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .brand img {
    filter: none;
    opacity: 0.85;
  }

  .nav-links {
    display: flex;
    gap: 0.25rem;
  }

  .nav-links a:hover,
  .nav-links a.active-link {
    color: #0f0e0b;
    border-color: #0f0e0b;
  }
</style>

<nav class="top-bar" *ngIf="showNav()">
  <a class="brand" routerLink="/home">
    <img src="assets/book.png" alt="Logo" width="24" height="24">
    Readly
  </a>
</nav>

<router-outlet></router-outlet>
