<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
    <img src="assets/book.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top me-2">
      Readly, tu biblioteca digital en un click
    </a>
  </div>
</nav>

<div class="container">
  <div class="row">
    <div class="col-md-8 mt-4">
      <ul class="list-group">
        <li
        *ngFor="let book of bookArray" 
        class="list-group-item list-group-item-action"
        (click)="openForEdit(book)"
        > 
        <span class="badge bg-dark text-white">{{book.id}}</span>        
        <strong>{{book.title}}</strong> - {{book.author}} ({{book.pages}} pág.)
        </li>
      </ul>
      <div class="card mt-4">
        <div class="card-body">
          <div class="card-title h5">
            Gestión de Libros
          </div>
          <div class="form-group mt-3">
            <input type="text" [(ngModel)]="selectedBook.title" placeholder="Título del libro" class="form-control">
          </div>
          <div class="form-group mt-2">
            <input type="text" [(ngModel)]="selectedBook.author" placeholder="Autor del libro" class="form-control">
          </div>
          <div class="form-group mt-2">
            <input type="number" [(ngModel)]="selectedBook.pages" placeholder="Número de páginas" class="form-control">
          </div>
          <div class="mt-3">
            <button (click)="addOrEdit()" class="btn btn-primary me-2">
              Guardar
            </button>
            <button (click)="delete()" class="btn btn-danger">
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
