<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#e8e0d0; --ink:#0f0e0b; --muted:#8a8070; --red:#c8463a; --font-display:'Playfair Display',serif; --font-body:'DM Sans',sans-serif; }
  body { background:var(--bg); font-family:var(--font-body); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

  .page { min-height:100vh; display:flex; align-items:center; justify-content:center; }

  .box { width:340px; animation:fadeUp 0.4s ease both; }

  .logo { font-family:var(--font-display); font-size:2.5rem; font-weight:900; letter-spacing:-2px; margin-bottom:0.3rem; }
  .logo em { color:var(--red); font-style:normal; }

  .sub { font-size:0.78rem; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:3rem; }

  .field { margin-bottom:1.6rem; }
  .label { display:block; font-size:0.66rem; letter-spacing:2.5px; text-transform:uppercase; color:var(--muted); margin-bottom:0.4rem; }
  .input { width:100%; background:transparent; border:none; border-bottom:2px solid var(--ink); padding:0.5rem 0; font-family:var(--font-body); font-size:0.95rem; color:var(--ink); outline:none; transition:border-color 0.2s; }
  .input:focus { border-color:var(--red); }
  .input::placeholder { color:#c4bdb2; }

  .btn { width:100%; margin-top:0.5rem; background:var(--ink); color:var(--bg); border:2px solid var(--ink); padding:0.8rem; font-family:var(--font-body); font-size:0.75rem; letter-spacing:3px; text-transform:uppercase; cursor:pointer; transition:background 0.2s,border-color 0.2s; }
  .btn:hover { background:var(--red); border-color:var(--red); }
</style>

<div class="page">
  <div class="box">
    <div class="logo">Read<em>ly</em></div>
    <div class="sub">Biblioteca digital</div>
    <div class="field">
      <label class="label">Usuario</label>
      <input type="text" [(ngModel)]="username" placeholder="nombre de usuario" class="input">
    </div>
    <div class="field">
      <label class="label">Contraseña</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••" class="input">
    </div>
    <button (click)="login()" class="btn">Entrar</button>
  </div>
</div>
