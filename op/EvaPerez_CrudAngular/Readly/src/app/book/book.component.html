<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#e8e0d0; --bg-card:#dfd7c7; --ink:#0f0e0b; --muted:#8a8070; --red:#c8463a; --green:#2d6a4f; --font-display:'Playfair Display',serif; --font-body:'DM Sans',sans-serif; }
  body { background:var(--bg); font-family:var(--font-body); color:var(--ink); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .page { min-height:100vh; padding:2.5rem 3rem; background:var(--bg); }
  .top { display:flex; align-items:baseline; gap:1rem; margin-bottom:2rem; border-bottom:2px solid var(--ink); padding-bottom:1rem; }
  .title { font-family:var(--font-display); font-size:2rem; font-weight:900; letter-spacing:-1px; }
  .title em { color:var(--red); font-style:normal; }
  .count { font-size:0.68rem; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }
  .layout { display:grid; grid-template-columns:1fr 320px; gap:2.5rem; align-items:start; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:0.9rem; }
  .card { background:var(--bg-card); border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); padding:1.2rem 1rem; cursor:pointer; transition:transform 0.15s,box-shadow 0.15s,background 0.15s,color 0.15s; animation:fadeUp 0.3s ease both; }
  .card:nth-child(2){animation-delay:.05s} .card:nth-child(3){animation-delay:.1s} .card:nth-child(4){animation-delay:.15s} .card:nth-child(5){animation-delay:.2s} .card:nth-child(6){animation-delay:.25s}
  .card:hover { transform:translate(-2px,-2px); box-shadow:4px 4px 0 var(--ink); }
  .card.selected { background:var(--ink); color:var(--bg); }
  .card.selected .meta { color:var(--muted); }
  .num { font-size:0.63rem; letter-spacing:2.5px; text-transform:uppercase; color:var(--muted); margin-bottom:0.4rem; }
  .name { font-family:var(--font-display); font-size:1rem; font-weight:700; line-height:1.2; margin-bottom:0.3rem; }
  .meta { font-size:0.75rem; color:var(--muted); font-weight:300; }
  .tag { display:inline-block; margin-top:0.7rem; font-size:0.63rem; letter-spacing:1.5px; text-transform:uppercase; padding:0.15rem 0.5rem; border:1.5px solid currentColor; opacity:0.5; }
  .panel { background:var(--bg); border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink); padding:1.8rem; position:sticky; top:1.5rem; }
  .panel-title { font-family:var(--font-display); font-size:1.2rem; font-weight:700; letter-spacing:-0.5px; margin-bottom:1.5rem; padding-bottom:0.8rem; border-bottom:2px solid var(--bg-card); }
  .field { margin-bottom:1.3rem; }
  .label { display:block; font-size:0.63rem; letter-spacing:2.5px; text-transform:uppercase; color:var(--muted); margin-bottom:0.35rem; }
  .input { width:100%; background:transparent; border:none; border-bottom:2px solid var(--ink); padding:0.5rem 0; font-family:var(--font-body); font-size:0.9rem; color:var(--ink); outline:none; transition:border-color 0.2s; }
  .input:focus { border-color:var(--red); }
  .input::placeholder { color:#c4bdb2; }
  .btns { display:flex; gap:0.6rem; margin-top:1.5rem; }
  .btn-save { flex:1; background:var(--ink); color:var(--bg); border:2px solid var(--ink); padding:0.65rem; font-family:var(--font-body); font-size:0.7rem; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:background 0.15s,border-color 0.15s; }
  .btn-save:hover { background:var(--green); border-color:var(--green); }
  .btn-del { flex:1; background:transparent; color:var(--red); border:2px solid var(--red); padding:0.65rem; font-family:var(--font-body); font-size:0.7rem; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:background 0.15s,color 0.15s; }
  .btn-del:hover { background:var(--red); color:white; }
  @media(max-width:800px) { .layout{grid-template-columns:1fr} .panel{position:static} .page{padding:1.5rem} }
</style>

<div class="page">
  <div class="top">
    <div class="title">Read<em>ly</em></div>
    <div class="count">{{ bookArray.length }} libros</div>
  </div>
  <div class="layout">
    <div class="cards">
      <div *ngFor="let book of bookArray" class="card" [class.selected]="selectedBook === book" (click)="openForEdit(book)">
        <div class="num">N.º {{ book.id }}</div>
        <div class="name">{{ book.title }}</div>
        <div class="meta">{{ book.author }}</div>
        <div class="tag">{{ book.pages }} pág.</div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">{{ selectedBook.id === 0 ? 'Añadir libro' : 'Editar libro' }}</div>
      <div class="field">
        <label class="label">Título</label>
        <input type="text" [(ngModel)]="selectedBook.title" placeholder="Título del libro" class="input">
      </div>
      <div class="field">
        <label class="label">Autor</label>
        <input type="text" [(ngModel)]="selectedBook.author" placeholder="Autor del libro" class="input">
      </div>
      <div class="field">
        <label class="label">Páginas</label>
        <input type="number" [(ngModel)]="selectedBook.pages" placeholder="Número de páginas" class="input">
      </div>
      <div class="btns">
        <button (click)="addOrEdit()" class="btn-save">Guardar</button>
        <button (click)="delete()" class="btn-del">Eliminar</button>
      </div>
    </div>
  </div>
</div>
