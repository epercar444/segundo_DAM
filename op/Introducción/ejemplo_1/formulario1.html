<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incripción equipo</title>
    <link rel="stylesheet" href="css/formulario.css">

</head>
<body>
    <h1>Incripción equipo</h1>
    <h5>Para que se muestren los sigueintes datos a rellenar debe clicar fuera del cuadro de formulario, gracias.</h5>
    <form id="form">
  <div class="field" id="field-email" style="display:block;">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="Ej:abcdefg@gmail.com" name="mails" required>
  </div>
  
  <div class="field" id="field-phone">
    <label for="phone">Teléfono</label>
    <input id="phone" type="tel" placeholder="Ej:123456789" name="phone" required>
  </div>

  <div class="field" id="field-dni">
    <label for="dni">DNI</label>
    <input id="dni" type="text" placeholder="Ej:12345678A" name="dni" required>
  </div>

  <div class="field" id="field-date">
    <label for="date">Fecha Nacimiento</label>
    <input id="date" type="date" name="date" required>
  </div>

  <div class="field" id="field-category">
    <label for="category">Categoría</label>
    <select id="category" name="category" required>
      <option value="">Selecciona una opción</option>
      <option value="1">Benjamín</option>
      <option value="2">Alevín</option>
      <option value="3">Infantil</option>
      <option value="4">Cadete</option>
      <option value="5">Juvenil</option>
    </select>
  </div>
</form>

    <script src ="./js/formularioScript.js"></script>
</body>
</html>
