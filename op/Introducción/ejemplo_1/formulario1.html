<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incripción equipo</title>
    <link rel="stylesheet" href="css/formulario.css">

</head>
<body>
    <h1>Incripción equipo</h1>
    <form id="form">
    <div id="field-email">
        <label for="email">Email</label>
            <input type="email" placeholder="Ej:abcdefg@gmail.com" name="mails" required>
    <div class="field" id="field-phone">
         <label for="telefono">Teléfono</label>
        <input type="tel" placeholder="Ej:123456789" name="phone" required>
    <div class="field" id="field-dni">
        <label for="dni">DNI</label>
            <input type="text" placeholder="Ej:12345678A" name="dni" required>
    <div class="field" id="field-date">
        <label for="fecha_nacimiento">Fecha Nacimiento</label>
            <input type="date" placeholder="dd/mm/aaaa" name="date" required>
    <div class="field" id="field-category">
        <label for="category">Categoría</label>
        <select name="category" required>
            <option value="">Selecciona una opción</option>
            <option value="1">Benjamín</option>
            <option value="2">Alevín</option>
            <option value="3">Infantil</option>
            <option value="4">Cadete</option>
            <option value="5">Juvenil</option>
    </form>
    <script src ="./js/formularioScript.js"></script>
</body>
</html>
